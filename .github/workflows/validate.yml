name: Validate content
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_repo.py
      - run: git diff --check
